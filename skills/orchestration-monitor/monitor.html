<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orchestration Monitor</title>
<style>
:root {
  --surface-0: #f4f4f2; --surface-1: #fcfcfb; --border: #e2e1dc; --track: #ecebe7;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #7a7974;
  --m-fable: #2a78d6; --m-opus: #eb6834; --m-sonnet: #1baf7a; --m-haiku: #eda100; --m-other: #9a9994;
  --good: #0ca30c; --warning: #fab219; --critical: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --surface-0: #111110; --surface-1: #1a1a19; --border: #2e2e2c; --track: #262624;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --m-fable: #3987e5; --m-opus: #d95926; --m-sonnet: #199e70; --m-haiku: #c98500; --m-other: #6f6e69;
  }
}
:root[data-theme="dark"] {
  --surface-0: #111110; --surface-1: #1a1a19; --border: #2e2e2c; --track: #262624;
  --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
  --m-fable: #3987e5; --m-opus: #d95926; --m-sonnet: #199e70; --m-haiku: #c98500; --m-other: #6f6e69;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface-0); color: var(--text-primary);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 48px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 16px; }
h1 { font-size: 20px; margin: 0; flex: 1 1 auto; }
h2 { font-size: 15px; margin: 0 0 12px; }
.muted { color: var(--text-muted); } .secondary { color: var(--text-secondary); }
select, button { font: inherit; color: var(--text-primary); background: var(--surface-1);
  border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 14px; }
.kpi .label { font-size: 12px; color: var(--text-secondary); }
.kpi .value { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 2px; }
.kpi .sub { font-size: 12px; color: var(--text-muted); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--text-secondary); margin-bottom: 10px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.bar-row { display: grid; grid-template-columns: 150px 1fr 96px; gap: 10px; align-items: center; margin: 7px 0; }
.bar-row .name { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row .num { text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
.track { height: 14px; background: var(--track); border-radius: 4px; position: relative; }
.fill { height: 100%; border-radius: 0 4px 4px 0; min-width: 2px; }
.stack { display: flex; height: 12px; gap: 2px; background: transparent; border-radius: 4px; overflow: hidden; }
.stack > div { height: 100%; min-width: 2px; }
.stack > div:last-child { border-radius: 0 4px 4px 0; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-weight: 600; color: var(--text-secondary); font-size: 12px; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.table-wrap { overflow-x: auto; }
.sess-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; margin-bottom: 6px; }
.sess-title { font-weight: 650; font-size: 15px; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 1px 8px;
  border-radius: 999px; border: 1px solid var(--border); color: var(--text-secondary); white-space: nowrap; }
.badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); }
.badge.running .dot { background: var(--good); animation: pulse 1.4s infinite; }
.badge.waiting .dot { background: var(--warning); }
@keyframes pulse { 50% { opacity: .35; } }
.action { font-family: ui-monospace, "JetBrains Mono", Menlo, monospace; font-size: 12px; color: var(--text-secondary);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.sess-meta { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; overflow-wrap: anywhere; }
.empty { padding: 24px; text-align: center; color: var(--text-muted); }
#tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface-1); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.18);
  display: none; max-width: 280px; font-variant-numeric: tabular-nums; }
#tip b { display: block; margin-bottom: 3px; }
.err { color: var(--critical); }
@media (max-width: 640px) { .bar-row { grid-template-columns: 96px 1fr 70px; } .hide-sm { display: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Orchestration Monitor</h1>
    <label class="secondary">기간
      <select id="hours">
        <option value="1">1시간</option><option value="6">6시간</option>
        <option value="24" selected>24시간</option><option value="168">7일</option><option value="720">30일</option>
      </select>
    </label>
    <label class="secondary"><input type="checkbox" id="onlyActive"> 활성 세션만</label>
    <button id="theme" title="테마 전환">테마</button>
    <span id="updated" class="muted" style="font-size:12px"></span>
  </header>

  <section class="kpis" id="kpis"></section>

  <section class="card">
    <h2>모델별 토큰 사용량 <span class="muted" style="font-weight:400;font-size:12px">(입력 + 출력 + 캐시 읽기/쓰기)</span></h2>
    <div id="modelBars"></div>
    <div class="table-wrap" style="margin-top:12px"><table id="modelTable"></table></div>
  </section>

  <h2 style="margin:20px 0 10px">세션 · 서브에이전트</h2>
  <div id="sessions"></div>
  <p class="muted" style="font-size:12px">데이터: ~/.claude/projects 의 Claude Code 트랜스크립트(읽기 전용). 3초마다 갱신. 토큰 수는 API usage 필드 합계이며 비용은 표시하지 않습니다.</p>
</main>
<div id="tip"></div>
<script>
const $ = s => document.querySelector(s);
const ORDER = ["fable", "opus", "sonnet", "haiku"];
const family = m => (ORDER.find(f => m.includes(f)) || "other");
const color = m => `var(--m-${family(m)})`;
const short = m => m.replace(/^claude-/, "");
const fmt = n => n >= 1e9 ? (n/1e9).toFixed(2)+"B" : n >= 1e6 ? (n/1e6).toFixed(2)+"M" : n >= 1e3 ? (n/1e3).toFixed(1)+"k" : String(n);
const full = n => n.toLocaleString("ko-KR");
const tot = u => u.input + u.output + u.cache_read + u.cache_write;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago = ts => { if (!ts) return "-"; const s = (Date.now() - Date.parse(ts)) / 1000;
  return s < 60 ? `${Math.max(0, s|0)}초 전` : s < 3600 ? `${(s/60)|0}분 전` : s < 86400 ? `${(s/3600)|0}시간 전` : `${(s/86400)|0}일 전`; };
const sortModels = obj => Object.entries(obj).sort((a, b) => {
  const fa = ORDER.indexOf(family(a[0])), fb = ORDER.indexOf(family(b[0]));
  return (fa < 0 ? 9 : fa) - (fb < 0 ? 9 : fb) || tot(b[1]) - tot(a[1]); });
const tipHTML = (m, u) => `<b>${esc(short(m))}</b>합계 ${full(tot(u))}<br>입력 ${full(u.input)} · 출력 ${full(u.output)}<br>캐시 읽기 ${full(u.cache_read)} · 쓰기 ${full(u.cache_write)}<br>API 호출 ${full(u.messages)}회`;

function stack(byModel) {
  const entries = sortModels(byModel), sum = entries.reduce((a, [, u]) => a + tot(u), 0) || 1;
  return `<div class="stack" role="img" aria-label="모델별 비율">${entries.map(([m, u]) =>
    `<div data-tip="${esc(tipHTML(m, u))}" style="flex:${tot(u)/sum};background:${color(m)}"></div>`).join("")}</div>`;
}
function modelChips(byModel) {
  return sortModels(byModel).map(([m, u]) => `<span style="white-space:nowrap"><span class="sw" style="background:${color(m)}"></span>${esc(short(m))} <span class="muted">${fmt(tot(u))}</span></span>`).join(" ");
}
function badge(status) {
  const label = {running: "실행 중", waiting: "대기(도구 실행)", done: "완료", idle: "유휴"}[status] || status;
  return `<span class="badge ${status}"><span class="dot"></span>${label}</span>`;
}

function render(d) {
  if (d.error) { $("#sessions").innerHTML = `<div class="card err">${esc(d.error)}</div>`; return; }
  let sessions = d.sessions;
  if ($("#onlyActive").checked) sessions = sessions.filter(s => s.active || s.subagents.some(a => a.status !== "done"));
  const grand = Object.values(d.totals).reduce((a, u) => { for (const k in a) a[k] += u[k]; return a; },
    {input: 0, output: 0, cache_read: 0, cache_write: 0, messages: 0});
  const running = d.sessions.reduce((n, s) => n + s.subagents.filter(a => a.status !== "done").length, 0);
  const activeS = d.sessions.filter(s => s.active).length;
  const subCount = d.sessions.reduce((n, s) => n + s.subagents.length, 0);
  $("#kpis").innerHTML = [
    ["총 토큰", fmt(tot(grand)), `출력 ${fmt(grand.output)} · 입력 ${fmt(grand.input)}`],
    ["캐시 읽기", fmt(grand.cache_read), `캐시 쓰기 ${fmt(grand.cache_write)}`],
    ["활성 세션", activeS, `전체 ${d.sessions.length}개 세션`],
    ["실행 중 서브에이전트", running, `기간 내 ${subCount}개 실행됨`],
  ].map(([l, v, s]) => `<div class="card kpi" style="margin:0"><div class="label">${l}</div><div class="value">${v}</div><div class="sub">${s}</div></div>`).join("");

  const models = sortModels(d.totals), max = Math.max(1, ...models.map(([, u]) => tot(u)));
  $("#modelBars").innerHTML = models.length ? models.map(([m, u]) => `
    <div class="bar-row" data-tip="${esc(tipHTML(m, u))}">
      <div class="name"><span class="sw" style="background:${color(m)}"></span>${esc(short(m))}</div>
      <div class="track"><div class="fill" style="width:${(tot(u)/max*100).toFixed(2)}%;background:${color(m)}"></div></div>
      <div class="num">${fmt(tot(u))}</div>
    </div>`).join("") : `<div class="empty">이 기간에 기록된 사용량이 없습니다.</div>`;
  $("#modelTable").innerHTML = models.length ? `<thead><tr><th>모델</th><th class="n">입력</th><th class="n">출력</th><th class="n hide-sm">캐시 읽기</th><th class="n hide-sm">캐시 쓰기</th><th class="n">합계</th><th class="n hide-sm">호출</th></tr></thead><tbody>` +
    models.map(([m, u]) => `<tr><td><span class="sw" style="background:${color(m)}"></span>${esc(short(m))}</td><td class="n">${full(u.input)}</td><td class="n">${full(u.output)}</td><td class="n hide-sm">${full(u.cache_read)}</td><td class="n hide-sm">${full(u.cache_write)}</td><td class="n"><b>${full(tot(u))}</b></td><td class="n hide-sm">${full(u.messages)}</td></tr>`).join("") + "</tbody>" : "";

  $("#sessions").innerHTML = sessions.length ? sessions.map(s => `
    <section class="card">
      <div class="sess-head">
        <span class="sess-title">${esc(s.title)}</span>
        ${badge(s.active ? "running" : "idle")}
        <span class="muted" style="font-size:12px">${ago(s.last_ts)} · 합계 ${fmt(tot(s.all_total))} 토큰</span>
      </div>
      <div class="sess-meta">${esc(s.cwd || s.project)}</div>
      ${stack(s.all_by_model)}
      <div class="legend" style="margin-top:8px">${modelChips(s.all_by_model)}</div>
      ${s.last_action ? `<div class="action" title="${esc(s.last_action)}">메인 마지막 작업 › ${esc(s.last_action)}</div>` : ""}
      ${s.subagents.length ? `<div class="table-wrap" style="margin-top:10px"><table>
        <thead><tr><th>서브에이전트</th><th>모델</th><th>상태</th><th class="n">토큰</th><th class="hide-sm">마지막 작업</th></tr></thead><tbody>
        ${s.subagents.map(a => `<tr>
          <td><b>${esc(a.type)}</b><div class="muted" style="font-size:12px">${esc(a.description || "")}</div></td>
          <td>${modelChips(a.by_model) || '<span class="muted">-</span>'}</td>
          <td>${badge(a.status)}<div class="muted" style="font-size:11px">${ago(a.last_ts)}</div></td>
          <td class="n" data-tip="${esc(tipHTML(a.type, a.total))}">${fmt(tot(a.total))}</td>
          <td class="hide-sm"><div class="action" style="max-width:340px" title="${esc(a.last_action || "")}">${esc(a.last_action || "-")}</div></td>
        </tr>`).join("")}</tbody></table></div>` : `<div class="muted" style="font-size:12px;margin-top:8px">서브에이전트 없음 (메인 세션만 작업)</div>`}
    </section>`).join("") : `<div class="card empty">표시할 세션이 없습니다.</div>`;
  $("#updated").textContent = "갱신 " + new Date(d.generated * 1000).toLocaleTimeString("ko-KR");
}

let timer;
async function load() {
  clearTimeout(timer);
  try {
    const r = await fetch(`/api/data?hours=${$("#hours").value}`, {cache: "no-store"});
    render(await r.json());
  } catch (e) { $("#updated").innerHTML = `<span class="err">연결 끊김 — monitor.py 실행 중인지 확인</span>`; }
  timer = setTimeout(load, 3000);
}
$("#hours").onchange = load; $("#onlyActive").onchange = load;
try { const t = localStorage.getItem("om-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
$("#theme").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("om-theme", next); } catch {}
};
const tip = $("#tip");
document.addEventListener("mousemove", e => {
  const el = e.target.closest("[data-tip]");
  if (!el) { tip.style.display = "none"; return; }
  tip.innerHTML = el.dataset.tip; tip.style.display = "block";
  const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8), y = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8);
  tip.style.left = x + "px"; tip.style.top = y + "px";
});
load();
</script>
</body>
</html>
